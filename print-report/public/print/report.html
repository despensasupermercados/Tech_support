    $("#tDocs").innerHTML = `<thead><tr>${th("name", "Document")}${th("cat", "Type")}${th("dept", "Department")}${th("n", "Times", 1)}${th("sheets", "Sheets", 1)}${th("med", "Typical time", 1)}${th("min", "Shortest", 1)}${th("max", "Longest", 1)}${S.money ? th("value", "Billed", 1) : ""}</tr></thead><tbody>${list.map((d) => `
      <tr class="click" data-k="${esc(d.key)}"><td class="doc">${esc(d.name)}${d.name.toLowerCase() !== d.key ? `<small>${esc(d.key)}</small>` : ""}</td><td><span class="pill">${esc(d.cat)}</span></td><td>${esc(d.dept)}</td>
      <td class="num"><b style="color:#fff">${n0(d.n)}</b></td><td class="num">${n0(d.sheets)}</td><td class="num">${dur(d.med)}</td><td class="num">${dur(d.min)}</td><td class="num">${dur(d.max)}</td>${S.money ? `<td class="num">${usd(d.value)}</td>` : ""}</tr>`).join("")}</tbody>`;
    $$("#tDocs th").forEach((t) => (t.onclick = () => { docSort = { k: t.dataset.k, dir: docSort.k === t.dataset.k ? -docSort.dir : -1 }; drawDocs(); }));
    $$("#tDocs tr.click").forEach((tr) => (tr.onclick = () => set({ doc: tr.dataset.k })));
    const top = Math.max(1, ...list.slice(0, 40).map((d) => d.n));
    $("#mDocs").innerHTML = list.slice(0, 40).map((d) => `<button class="mrow" data-k="${esc(d.key)}"><span class="mr-main"><b>${esc(d.name)}</b><span class="mr-bar"><i style="width:${(100 * d.n) / top}%"></i></span><small>${esc(d.cat)} · typical ${dur(d.med)}</small></span><span class="mr-big">×${n0(d.n)}</span></button>`).join("");
    $$("#mDocs .mrow").forEach((b) => (b.onclick = () => set({ doc: b.dataset.k })));
    if (!q) capList($("#mDocs"), 12);
  };
  $("#docQ").oninput = drawDocs; drawDocs();

  // dept × category matrix
  const m = metric();
  const depts = groupBy(jobs, (j) => j.dept, m.get).map((x) => x[0]).slice(0, 14);
  const catsM = groupBy(jobs, (j) => j.cat, m.get).map((x) => x[0]).filter((c) => c !== "Test Pattern / Copy");
  const cell = new Map(); for (const j of jobs) { const key = j.dept + "|" + j.cat; cell.set(key, (cell.get(key) || 0) + m.get(j)); }
  const md = []; let mx = 0;
  catsM.forEach((c, x) => depts.forEach((d, y) => { const v = cell.get(d + "|" + c) || 0; mx = Math.max(mx, v); if (v) md.push([x, y, v]); }));
  chart("chMx", {
    grid: { left: 8, right: 14, top: 8, bottom: 8, containLabel: true },
    tooltip: { formatter: (p) => `<b>${esc(depts[p.value[1]])}</b> · ${esc(catsM[p.value[0]])}<br>${m.fmt(p.value[2])}` },
    xAxis: { type: "category", data: catsM, position: "top", axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: C.ink3, fontSize: 11, rotate: 35, interval: 0 } },
    yAxis: { type: "category", data: depts, inverse: true, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: C.ink2, fontSize: 12 } },
    visualMap: { show: false, min: 0, max: mx || 1, inRange: { color: RAMP.slice(1) } },
    series: [{ type: "heatmap", data: md, itemStyle: { borderColor: css("--card"), borderWidth: 2, borderRadius: 3 } }],
  }, (p) => set({ depts: [depts[p.value[1]]], cats: [catsM[p.value[0]]] }));
  // phone: each department and the three document types it prints most (machine hours)
  $("#mMxList").innerHTML = depts.slice(0, 10).map((d) => { const row = catsM.map((c) => [c, cell.get(d + "|" + c) || 0]).filter((x) => x[1] > 0).sort((x, y) => y[1] - x[1]); const tot2 = row.reduce((t, x) => t + x[1], 0) || 1;
    return `<button class="mrow" data-d="${esc(d)}"><span class="mr-main"><b>${esc(d)}</b><span class="stack">${row.slice(0, 3).map((x, i) => `<i style="flex:${x[1]};background:${SERIES[i]}"></i>`).join("")}<i style="flex:${Math.max(0, tot2 - row.slice(0, 3).reduce((t, x) => t + x[1], 0))};background:var(--line-2)"></i></span><span class="mxk">${row.slice(0, 3).map((x, i) => `<span><i class="dot" style="background:${SERIES[i]}"></i>${esc(x[0])} <b>${pct(x[1], tot2)}%</b></span>`).join("")}</span></span></button>`; }).join("");
  $$("#mMxList .mrow").forEach((b) => (b.onclick = () => set({ depts: [b.dataset.d] })));
  capList($("#mMxList"), 6);
}

// ---- Stalls
function stalls({ jobs, k }) {
  const st = jobs.filter((j) => (j.stallS || 0) >= STALL_JOB_S).sort((x, y) => y.stallS - x.stallS);
  const longest = st[0];
  const bases = SHIPS.filter((s) => BASE[s]).map((s) => `<b>${esc(s)}</b> ${Math.round(BASE[s].setupS)} s setup + ${BASE[s].secPerSheet.toFixed(1)} s a sheet`).join(" · ");
  $("#tab").innerHTML = `
  <div class="kpis">
    <div class="card kpi" style="--kc:${C.stall}"><div class="v">${hrs(k.b.stallS)}<small>h</small></div><div class="l">stalled on the press</div><div class="d">${pct(k.b.stallS, k.b.busyS)}% of busy time</div></div>
    <div class="card kpi" style="--kc:${C.stall}"><div class="v">${n0(st.length)}</div><div class="l">jobs stalled 5 min or more</div><div class="d">${pct(st.length, k.jobs)}% of jobs</div></div>
    <div class="card kpi"><div class="v">${n0(st.filter((j) => j.stallS >= 3600).length)}</div><div class="l">stalled more than 1 hour</div></div>
    <div class="card kpi"><div class="v">${longest ? dur(longest.stallS).replace(" min", "<small>min</small>") : "—"}</div><div class="l">longest single stall</div><div class="d">${longest ? `${esc(longest.ship)} · ${fday(longest.day)}` : ""}</div></div>
    <div class="card kpi"><div class="v">${hrs(k.b.printS)}<small>h</small></div><div class="l">printing at normal speed</div></div>
    <div class="card kpi"><div class="v">${durTile(typicalDay(jobs).stall)}</div><div class="l">stalled per press, on a typical day</div></div>
  </div>
  <div class="grid" style="margin-top:14px">
    <div class="card panel c6"><div class="ph"><div><h2>Stalled time by department</h2><p>Whose jobs sat on the press. Click to filter.</p></div></div><div class="chart" id="chStD"></div></div>
    <div class="card panel c6"><div class="ph"><div><h2>When stalled jobs were started</h2><p>Hour the job started. Overnight starts point to jobs left running unattended.</p></div></div><div class="chart" id="chStH"></div></div>
    <div class="card panel c12"><div class="ph"><div><h2>Longest stalls</h2><p>Each job against its ship's normal time for that many sheets. Click a row to see that day.</p></div></div>
      <div class="m-only" id="mSt">${st.slice(0, 40).map((j) => `<button class="mrow st" data-d="${j.day}" data-s="${esc(j.ship)}"><span class="mr-main"><b>${esc(docLabel(j.key))}</b><small><i class="dot" style="background:${shipColor(j.ship)}"></i> ${esc(j.ship)} · ${fdayShort(j.day)}</small>
        <span class="vsb"><i class="took" style="width:100%"></i><em>took ${hmS(j.runS)}</em></span><span class="vsb"><i style="width:${Math.max(2, (100 * (j.expS || 0)) / j.runS)}%"></i><em>normal ${hmS(j.expS)}</em></span></span><span class="mr-big stall">+${hmS(j.stallS)}</span></button>`).join("")}</div>
      <div class="tbl-wrap d-only"><table class="t"><thead><tr><th>Ended</th><th>Ship</th><th>Dept</th><th>Document</th><th class="num">Sheets</th><th class="num">Normal time</th><th class="num">Actual</th><th class="num">Stalled</th><th>Result</th></tr></thead><tbody>
      ${st.slice(0, 150).map((j) => `<tr class="click" data-d="${j.day}" data-s="${esc(j.ship)}"><td>${fday(j.day)} <span class="muted">${j.endTs.slice(11, 16)}</span></td><td>${esc(j.ship)}</td><td>${esc(j.dept)}</td><td class="doc">${esc(j.file || "(no file name)")}<small>${esc(j.cat)}</small></td><td class="num">${n0(j.feed)}</td><td class="num">${dur(j.expS)}</td><td class="num">${dur(j.runS)}</td><td class="num"><span class="pill stall">${dur(j.stallS)}</span></td><td>${j.result === "Complete" ? "Completed" : `<span class="pill cancel">${esc(j.result)}</span>`}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="method"><b>How "stalled" is measured.</b> Each press's normal speed is measured from its own completed jobs: ${bases || "not enough history yet"}. A job may take up to ${TOLERANCE}× its normal time and still count as printing, which covers duplex, heavy stock and a slow file. Time beyond that is stalled: paper out, a jam, or a job left waiting on the press. The log does not say which.</div></div>
  </div>`;
  $$("#tab tr.click, #tab .mrow.st").forEach((tr) => (tr.onclick = () => set({ day: tr.dataset.d, ships: [tr.dataset.s], tab: "jobs" })));
  capList($("#mSt"), 12);
  const byDept = capRows(groupBy(jobs, (j) => j.dept, (j) => (j.stallS || 0) / 3600).filter((r) => r[1] > 0), PHONE() ? 9 : 14);
  chart("chStD", {
    grid: { left: 8, right: 60, top: 6, bottom: 6, containLabel: true },
    tooltip: { formatter: (p) => `<b>${esc(p.name)}</b><br>${hrs(p.value * 3600)} h stalled` },
    xAxis: axis({ type: "value", show: false }),
    yAxis: axis({ type: "category", data: byDept.map((r) => r[0]).reverse(), axisLine: { show: false }, axisLabel: { color: C.ink2, fontSize: 12 } }),
    series: [{ type: "bar", data: byDept.map((r) => +r[1].toFixed(2)).reverse(), itemStyle: { color: C.stall, borderRadius: [0, 4, 4, 0] }, barMaxWidth: 16, label: { show: true, position: "right", color: C.ink2, fontSize: 11.5, formatter: (p) => `${hrs(p.value * 3600)} h` } }],
  }, (p) => { if (p.name !== "All others") set({ depts: [p.name] }); });
  const hours = new Array(24).fill(0); for (const j of st) hours[new Date(j.startMs).getUTCHours()] += j.stallS / 3600;
  chart("chStH", {
    grid: { left: 40, right: 12, top: 14, bottom: 28 },
    tooltip: { trigger: "axis", formatter: (ps) => `<b>Started ${ps[0].name}</b><br>${hrs(ps[0].value * 3600)} h stalled` },
    xAxis: axis({ type: "category", data: [...Array(24).keys()].map(hh), splitLine: { show: false } }),
    yAxis: axis({ type: "value", name: "h", nameTextStyle: { color: C.ink3 }, axisLine: { show: false } }),
    series: [{ type: "bar", data: hours.map((v) => +v.toFixed(2)), itemStyle: { color: C.stall, borderRadius: [4, 4, 0, 0] }, barMaxWidth: 18 }],
  }, (p) => set({ hour: String(p.dataIndex), tab: "jobs" }));
}

// ---- Cancels & waste
function cancels({ jobs, k }) {
  const auth = jobs.filter((j) => j.result === "Authentication Error").length;
  const never = jobs.filter((j) => j.runS == null).length;
  $("#tab").innerHTML = `
  <div class="kpis">
    <div class="card kpi" style="--kc:${css("--critical")}"><div class="v">${n0(k.cancels)}</div><div class="l">jobs cancelled</div><div class="d">${pct(k.cancels, k.jobs)}% of all jobs</div></div>
    <div class="card kpi"><div class="v">${n0(k.waste)}</div><div class="l">waste sheets</div><div class="d">${k.sheets ? ((100 * k.waste) / k.sheets).toFixed(1) : 0}% of sheets fed</div></div>
    <div class="card kpi"><div class="v">${n0(never)}</div><div class="l">jobs that never started</div><div class="d">cancelled or refused before printing</div></div>
    <div class="card kpi"><div class="v">${n0(auth)}</div><div class="l">authentication errors</div><div class="d">wrong or missing account on the job</div></div>
    <div class="card kpi"><div class="v">${hrs(jobs.filter((j) => j.result === "Cancel").reduce((a, j) => a + (j.runS || 0), 0))}<small>h</small></div><div class="l">press time on jobs later cancelled</div></div>
    <div class="card kpi"><div class="v">${n0(jobs.filter((j) => j.result === "Cancel").reduce((a, j) => a + j.feed, 0))}</div><div class="l">sheets fed on cancelled jobs</div></div>
  </div>
  <div class="grid" style="margin-top:14px">
    <div class="card panel c6"><div class="ph"><div><h2>Cancelled jobs by department</h2><p>Bar = number cancelled; label = share of that department's jobs.</p></div></div><div class="chart" id="chCx"></div></div>
    <div class="card panel c6"><div class="ph"><div><h2>Waste sheets, week by week</h2><p>Sheets the press counted as waste.</p></div></div><div class="chart" id="chWs"></div></div>
    <div class="card panel c12"><div class="ph"><div><h2>Documents cancelled most often</h2></div></div><div class="tbl-wrap d-only" style="max-height:420px"><table class="t" id="tCx"></table></div><div class="m-only" id="mCx"></div></div>
  </div>`;
  const tot = new Map(groupBy(jobs, (j) => j.dept, () => 1));
  const cx = capRows(groupBy(jobs.filter((j) => j.result === "Cancel"), (j) => j.dept, () => 1), PHONE() ? 9 : 14);
  if (cx.some((r) => r[0] === "All others")) { const named = new Set(cx.map((r) => r[0])); tot.set("All others", [...tot.entries()].filter(([d]) => !named.has(d)).reduce((t, [, n]) => t + n, 0)); }
  chart("chCx", {
    grid: { left: 8, right: 90, top: 6, bottom: 6, containLabel: true },
    tooltip: { formatter: (p) => `<b>${esc(p.name)}</b><br>${n0(p.value)} cancelled of ${n0(tot.get(p.name))} jobs (${pct(p.value, tot.get(p.name))}%)` },
    xAxis: axis({ type: "value", show: false }),
    yAxis: axis({ type: "category", data: cx.map((r) => r[0]).reverse(), axisLine: { show: false }, axisLabel: { color: C.ink2, fontSize: 12 } }),
    series: [{ type: "bar", data: cx.map((r) => r[1]).reverse(), itemStyle: { color: css("--critical"), borderRadius: [0, 4, 4, 0] }, barMaxWidth: 16, label: { show: true, position: "right", color: C.ink2, fontSize: 11.5, formatter: (p) => `${n0(p.value)} · ${pct(p.value, tot.get(p.name))}%` } }],
  }, (p) => { if (p.name !== "All others") set({ depts: [p.name], result: "Cancel", tab: "jobs" }); });
  const [a, b] = periodRange(); const weeks = []; for (let d = weekStart(a); d <= b; d = addDays(d, 7)) weeks.push(d);
  const ws = new Map(groupBy(jobs, (j) => weekStart(j.day), (j) => j.waste));
  chart("chWs", {
    grid: { left: 44, right: 12, top: 14, bottom: 28 },
    tooltip: { trigger: "axis", formatter: (ps) => `<b>Week of ${fday(weeks[ps[0].dataIndex])}</b><br>${n0(ps[0].value)} waste sheets` },
    xAxis: axis({ type: "category", data: weeks.map(fdayShort), splitLine: { show: false } }),
    yAxis: axis({ type: "value", axisLine: { show: false } }),
    series: [{ type: "bar", data: weeks.map((w) => ws.get(w) || 0), itemStyle: { color: C.print, borderRadius: [4, 4, 0, 0] }, barMaxWidth: 18 }],
  });
  const cd = groupBy(jobs.filter((j) => j.result === "Cancel" && j.key !== "(no file name)"), (j) => j.key, () => 1).slice(0, 60);
  $("#tCx").innerHTML = `<thead><tr><th>Document</th><th class="num">Cancelled</th><th class="num">Printed</th><th class="num">Cancel rate</th></tr></thead><tbody>${cd.map(([key, n]) => { const all = jobs.filter((j) => j.key === key).length; return `<tr class="click" data-k="${esc(key)}"><td class="doc">${esc(docLabel(key))}</td><td class="num"><b style="color:#fff">${n0(n)}</b></td><td class="num">${n0(all - n)}</td><td class="num">${pct(n, all)}%</td></tr>`; }).join("")}</tbody>`;
  $$("#tCx tr.click").forEach((tr) => (tr.onclick = () => set({ doc: tr.dataset.k, tab: "jobs" })));
  const topCx = Math.max(1, ...cd.map((x) => x[1]));
  $("#mCx").innerHTML = cd.slice(0, 40).map(([key, n]) => { const all = jobs.filter((j) => j.key === key).length; return `<button class="mrow" data-k="${esc(key)}"><span class="mr-main"><b>${esc(docLabel(key))}</b><span class="mr-bar"><i class="cx" style="width:${(100 * n) / topCx}%"></i></span><small>${pct(n, all)}% of its ${n0(all)} jobs cancelled</small></span><span class="mr-big">×${n0(n)}</span></button>`; }).join("");
  $$("#mCx .mrow").forEach((b) => (b.onclick = () => set({ doc: b.dataset.k, tab: "jobs" })));
  capList($("#mCx"), 12);
}

// ---- Jobs
let jobSort = { k: "endMs", dir: -1 }, jobPage = 0;
function jobsTab({ jobs }) {
  const PAGE = 100;
  $("#tab").innerHTML = `<div class="card panel"><div class="tbar"><div><h2>${n0(jobs.length)} jobs</h2><p class="muted" style="font-size:12.5px">Every job matching the filters. Click a column to sort.</p></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="pager" id="pager"></div><button class="btn" id="csv">Download CSV</button></div></div>
    <div class="m-only" id="mJobs"></div>
    <div class="tbl-wrap d-only" style="max-height:none"><table class="t" id="tJobs"></table></div></div>`;
  const cols = [["endMs", "Ended"], ["ship", "Ship"], ["dept", "Dept"], ["file", "Document"], ["feed", "Sheets", 1], ["color", "Colour", 1], ["black", "Black", 1], ["runS", "Time", 1], ["expS", "Normal", 1], ["stallS", "Stalled", 1], ["result", "Result"]];
  if (S.money) cols.push(["value", "Billed", 1]);
  const draw = () => {
    const { k: key, dir } = jobSort;
    const list = jobs.slice().sort((x, y) => { const a2 = x[key] ?? -Infinity, b2 = y[key] ?? -Infinity; return (typeof a2 === "string" ? a2.localeCompare(b2) : a2 - b2) * dir; });
    const pages = Math.max(1, Math.ceil(list.length / PAGE)); jobPage = Math.min(jobPage, pages - 1);
    const rows = list.slice(jobPage * PAGE, jobPage * PAGE + PAGE);
    $("#tJobs").innerHTML = `<thead><tr>${cols.map(([c, l, num]) => `<th data-k="${c}" class="${num ? "num" : ""}">${l}${jobSort.k === c ? `<span class="ar"> ${dir < 0 ? "↓" : "↑"}</span>` : ""}</th>`).join("")}</tr></thead><tbody>${rows.map((j) => `<tr>
      <td>${fday(j.day)} <span class="muted">${j.endTs.slice(11, 16)}</span></td><td>${esc(j.ship)}</td><td>${esc(j.dept)}</td><td class="doc">${esc(j.file || "(no file name)")}<small>${esc(j.cat)}</small></td>
      <td class="num">${n0(j.feed)}</td><td class="num">${n0(j.color)}</td><td class="num">${n0(j.black)}</td><td class="num">${dur(j.runS)}</td><td class="num">${dur(j.expS)}</td>
      <td class="num">${(j.stallS || 0) >= STALL_JOB_S ? `<span class="pill stall">${dur(j.stallS)}</span>` : j.stallS == null ? "—" : ""}</td>
      <td>${j.result === "Complete" ? "Completed" : `<span class="pill cancel">${esc(j.result)}</span>`}</td>${S.money ? `<td class="num">${usd(j.value)}</td>` : ""}</tr>`).join("")}</tbody>`;
    $$("#tJobs th").forEach((t) => (t.onclick = () => { jobSort = { k: t.dataset.k, dir: jobSort.k === t.dataset.k ? -jobSort.dir : -1 }; draw(); }));
    $("#mJobs").innerHTML = rows.slice(0, 50).map((j) => `<div class="mrow job"><span class="mr-main"><b>${esc(docLabel(j.key) === j.key ? j.file || "(no file name)" : j.file || "(no file name)")}</b><small><i class="dot" style="background:${shipColor(j.ship)}"></i> ${esc(j.ship)} · ${esc(j.dept)} · ${fdayShort(j.day)} ${j.endTs.slice(11, 16)} · ${n0(j.feed)} sh</small></span><span class="mr-big sm">${dur(j.runS)}${(j.stallS || 0) >= STALL_JOB_S ? `<em class="stall">+${dur(j.stallS)}</em>` : ""}${j.result !== "Complete" ? `<em class="cx">${esc(j.result)}</em>` : ""}</span></div>`).join("");
    $("#pager").innerHTML = `<button class="btn" ${jobPage ? "" : "disabled"} data-p="-1">‹</button> page ${jobPage + 1} of ${pages} <button class="btn" ${jobPage < pages - 1 ? "" : "disabled"} data-p="1">›</button>`;
    $$("#pager button").forEach((bt) => (bt.onclick = () => { jobPage += +bt.dataset.p; draw(); }));
  };
  draw();
  $("#csv").onclick = () => {
    const head = ["ship", "job_id", "ended", "time_zone", "ended_press_clock_utc-5", "department", "document_type", "file_name", "result", "sheets", "colour_clicks", "black_clicks", "run_seconds", "normal_seconds", "stalled_seconds", "billed_usd"];
    const q = (v) => (v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v);
    const lines = [head.join(",")].concat(jobs.map((j) => [j.ship, j.jobId, j.endTs, j.tz, j.pressTs, j.dept, j.cat, j.file, j.result, j.feed, j.color, j.black, j.runS, j.expS == null ? "" : Math.round(j.expS), j.stallS == null ? "" : Math.round(j.stallS), j.value.toFixed(2)].map(q).join(",")));
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `print-jobs-${periodRange().join("_")}.csv`; a.click();
  };
}

// ---------------------------------------------------------------- night watch status
async function nightWatch() {
  let d; try { d = await fetch("api/watch").then((r) => r.json()); } catch { return; }
  const run = d.latest; const btn = $("#watchBtn");
  if (!run) return;
  const warn = run.checks.filter((c) => c.status === "warn").length, fail = run.checks.filter((c) => c.status === "fail").length;
  const when = new Date(run.ran_at); const ago = Math.round((Date.now() - when) / 3600000);
  btn.hidden = false; btn.className = "watchbtn " + run.status;
  btn.innerHTML = `<i></i>Night watch: ${fail ? `${fail} problem${fail > 1 ? "s" : ""}` : warn ? `${warn} to look at` : "all clear"} · ${ago < 1 ? "just now" : ago < 48 ? `${ago} h ago` : fday(run.ran_at.slice(0, 10))}`;
  const order = { fail: 0, warn: 1, info: 2, ok: 3 };
  $("#watchWhen").textContent = `Last run ${run.ran_at.slice(0, 16).replace("T", " ")} UTC (${run.trigger}). Runs every night at 06:15 UTC; problems and new findings are emailed.`;
  $("#watchList").innerHTML = run.checks.slice().sort((a, b) => order[a.status] - order[b.status]).map((c) => `<div class="wrow"><span class="st ${c.status}">${c.status.toUpperCase()}</span><div><b>${esc(c.title)}</b>${c.detail ? `<div>${esc(c.detail)}</div>` : ""}</div></div>`).join("");
  btn.onclick = () => ($("#watchModal").hidden = false);
  $("#watchClose").onclick = () => ($("#watchModal").hidden = true);
  $("#watchModal").onclick = (e) => { if (e.target.id === "watchModal") $("#watchModal").hidden = true; };
}

// ---------------------------------------------------------------- boot
(async () => {
  readHash();
  let ok;
  try { ok = await load(); }
  catch (e) { $("#main").innerHTML = `<div class="card empty"><h2>Could not load the record</h2><p>No connection, or the server did not answer. Refresh to try again.</p></div>`; return; }
  if (!ok) { $("#main").innerHTML = `<div class="card empty"><h2>Nothing on file yet</h2><p>Drop the first press job history on the upload page and the report fills in.</p><p style="margin-top:14px"><a class="btn primary" href="./">Go to upload</a></p></div>`; return; }
  $("#filters").hidden = false;
  $("#foot").textContent = `cims-print · $ at ${CPC.label} [${CPC.source}]`;
  buildControls(); syncControls(); render();
  nightWatch();
  addEventListener("hashchange", () => { readHash(); if (S.clk !== DERIVED) derive(); syncControls(); render(); });
})();

// Stay current. Tapping tabs, months and ships only changes the #hash, so a tab
// left open on a phone never reloads and keeps running old code (Miguel read a
// two-days-old layout on 24 Sep). When the page comes back into view — or every
// 15 min — it asks the server which version is live and reloads if it changed.
// Everything the view shows lives in the URL, so a reload loses nothing.
(() => {
  let seen = null;
  const check = async () => {
    try {
      const v = (await fetch("api/health", { cache: "no-store" }).then((r) => r.json())).version;
      if (seen && v && v !== seen) location.reload();
      seen = seen || v;
    } catch {}
  };
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  addEventListener("pageshow", (e) => { if (e.persisted) check(); });
  setInterval(check, 15 * 60 * 1000);
})();
</script>
