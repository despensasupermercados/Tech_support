<html lang="en">
<head>
<meta charset="utf-8">

<title>Print Report — CIMS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 18px; }
.datachip { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 900px) { .datachip { display: none; } }

/* filter bar */
.filters { position: sticky; top: 57px; z-index: 40; background: rgba(10,15,22,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.frow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 0; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line-2); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 11px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: #fff; }
.seg button.on { background: var(--card-2); color: #fff; box-shadow: inset 0 0 0 1px var(--line-2); }
.dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
.ctl { height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); padding: 0 10px; font-size: 12.5px; }
input.ctl[type=date] { color-scheme: dark; }
.search { min-width: 180px; flex: 1 1 180px; max-width: 280px; }
.dd { position: relative; }
.dd > button { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
.dd > button .cnt { font-family: var(--mono); font-size: 10.5px; background: var(--brand); color: #07210a; border-radius: 6px; padding: 1px 6px; }
.pop { position: absolute; top: 42px; left: 0; z-index: 60; min-width: 240px; max-height: 380px; overflow: auto; padding: 8px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.5); display: none; }
.dd.open .pop { display: block; }
.pop label { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.pop label:hover { background: var(--card); }
.pop label .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.pop .pa { display: flex; gap: 6px; padding: 4px 4px 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.pop .pa button { flex: 1; height: 28px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; font-size: 12px; }
input[type=checkbox] { accent-color: var(--brand); width: 15px; height: 15px; }
.active { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 10px; }
.active:empty { display: none; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 999px; background: rgba(57,135,229,.14); border: 1px solid rgba(57,135,229,.45); font-size: 12px; color: #cfe2fa; }
.fchip button { border: 0; background: transparent; cursor: pointer; color: inherit; width: 18px; height: 18px; border-radius: 50%; }
.fchip button:hover { background: rgba(255,255,255,.12); }
.linkbtn { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 12px; text-decoration: underline; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle i { width: 34px; height: 20px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle.on i { background: var(--brand); } .toggle.on i::after { transform: translateX(14px); }

.scope { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding: 0 0 10px; }
.scope .lab { font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-3); }
.scope b { color: #fff; font-weight: 600; }
.showmore { display: block; width: 100%; margin-top: 8px; height: 42px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); color: #cfe2fa; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.mr-bar i.cx { background: var(--critical); }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 5px; gap: 1px; }
.stack i { display: block; min-width: 2px; }
.mxk { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11.5px; color: var(--ink-2); }
.mxk span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.mxk b { color: #fff; font-weight: 600; }
.mk { font-size: 11.5px; color: var(--ink-3); margin: 0 0 6px; }
.kpi .d.dl.down { color: #f2b8a8; } .kpi .d.dl.up { color: #a9dcb0; }
.monthrow { display: flex; align-items: center; gap: 8px; }
.monthrow .months { flex: 1; min-width: 0; }
.months { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 10px; }
.months::-webkit-scrollbar { display: none; }
.months button { flex: 0 0 auto; position: relative; font: inherit; font-size: 13px; font-weight: 600; min-width: 52px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--card); color: var(--ink-2); border: 1px solid var(--line-2); cursor: pointer; }
.months button:hover { color: #fff; }
.months button.on { background: #3987e5; border-color: #3987e5; color: #fff; }
.months .part { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.scope .clk { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.scope .clk button { font: inherit; font-size: 11.5px; padding: 3px 10px; background: transparent; color: var(--ink-3); border: 0; cursor: pointer; }
.scope .clk button.on { background: rgba(57,135,229,.18); color: #fff; }
.where { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: #cfe2fa; background: rgba(57,135,229,.12); border-radius: 999px; padding: 1px 8px; }
.where.est { color: var(--ink-3); background: rgba(255,255,255,.05); }
.where svg { width: 12px; height: 12px; }
.scope.narrow { color: #f6d9a8; } .scope.narrow .lab { color: var(--warn); }
.scope.narrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
/* insights */
.ibar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; margin-bottom: 12px; }
.inav { display: flex; align-items: center; gap: 8px; }
.dnav { display: flex; align-items: center; gap: 8px; }
.dnav-d { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 118px; height: 44px; line-height: 1.1; }
.dnav-d b { font-family: var(--display); font-size: 18px; color: #fff; font-weight: 600; white-space: nowrap; }
.dnav-d small { font-size: 11px; color: var(--ink-3); }
.dnav .btn { height: 40px; min-width: 40px; padding: 0 12px; font-size: 18px; }
.dnav .chipbtn { font-size: 12.5px; margin-left: 4px; color: #f6d9a8; }
.gsum { display: grid; gap: 8px; margin-top: 8px; }
.gs { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "a h" "w w"; gap: 2px 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
.gs.off { opacity: .55; }
.gs.gap { opacity: 1; border-color: rgba(240,180,60,.4); border-style: dashed; }
.gs.gap .gs-t, .gs.gap .gs-w { color: #f0c46a; }
.warnt { color: #f0c46a; }
.gapnote { font-size: 11.5px; color: #f0c46a; margin-top: 4px; }
.gs-a { grid-area: a; display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; }
.gs-a b { color: #fff; font-size: 14px; }
.gs-t { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.gs-h { grid-area: h; text-align: right; font-family: var(--display); font-size: 18px; font-weight: 600; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gs-h em { display: block; font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--serious); }
.gs-w { grid-area: w; font-size: 12px; color: #cfe2fa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs-w.est { color: var(--ink-3); }
@media (min-width: 701px) { .gsum { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
@media (max-width: 700px) { .chart.gantt { height: var(--gh) !important; } .ph:has(.dnav) { flex-direction: column; align-items: stretch; } .dnav { justify-content: space-between; } .dnav-d { flex: 1; } }
.inav { flex-wrap: wrap; }
.inav .per { font-family: var(--display); font-size: 22px; font-weight: 600; color: #fff; min-width: 220px; text-align: center; }
@media (max-width: 560px) { .inav .per { min-width: 0; font-size: 18px; flex: 1 1 100%; order: -1; text-align: left; } }
.inav .btn { height: 36px; padding: 0 12px; }
.part { color: var(--warn); }
.icards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.icol { display: grid; gap: 10px; align-content: start; }
.icols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.icol h3 { font-family: var(--display); font-size: 17px; display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px; }
.icard { display: flex; gap: 12px; text-align: left; width: 100%; color: inherit; cursor: pointer; padding: 14px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); transition: border-color .15s, transform .15s; }
.icard:hover { border-color: var(--line-2); transform: translateY(-1px); }
.icard .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(95,185,70,.12); color: var(--brand-ink); }
.icard.warn .ic { background: rgba(236,131,90,.14); color: var(--serious); }
.icard.hot .ic { background: rgba(250,178,25,.14); color: var(--warn); }
.icard .t { font-family: var(--mono); font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.icard.warn .t { color: var(--serious); } .icard.hot .t { color: var(--warn); }
.icard .x { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.icard .x b { color: #fff; font-weight: 600; }
.icard .go { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
@media (prefers-reduced-motion: reduce) { .icard:hover { transform: none; } }
/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 16px 0 0; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: transparent; color: var(--ink-3); font-weight: 600; font-size: 14px; padding: 10px 14px; border-radius: 10px 10px 0 0; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: #fff; border-bottom-color: var(--brand); }
.tabline { height: 1px; background: var(--line); margin-bottom: 18px; }

/* grid */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 1100px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }
.panel { padding: 16px 18px; min-width: 0; }
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.ph p { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.chart { width: 100%; height: 320px; }
.chart.tall { height: 420px; } .chart.short { height: 260px; }

/* KPI tiles */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px 13px; position: relative; overflow: hidden; }
.kpi .v { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.1; letter-spacing: -.5px; color: #fff; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 15px; color: var(--ink-2); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.kpi .l { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.kpi .d { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 6px; }
.kpi .splitbar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-top: 8px; gap: 2px; }
.kpi .splitbar i:first-child { background: var(--s1); } .kpi .splitbar i:last-child { background: var(--serious); }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--kc, var(--line-2)); }

/* insights */
.insights { display: grid; gap: 8px; }
.ins { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s; text-align: left; width: 100%; color: inherit; }
.ins:hover { border-color: var(--line-2); }
.ins .ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(95,185,70,.12); color: var(--brand-ink); }
.ins .ic.warn { background: rgba(236,131,90,.14); color: var(--serious); }
.ins b { color: #fff; font-weight: 600; }
.ins div { font-size: 13.5px; color: var(--ink-2); }

/* legend + method */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.method { font-size: 12.5px; color: var(--ink-3); border-left: 2px solid var(--line-2); padding: 4px 0 4px 12px; margin-top: 10px; }
.method b { color: var(--ink-2); }
.metric-seg button { height: 26px; font-size: 12px; padding: 0 9px; }

/* tables */
.tbl-wrap { overflow: auto; max-height: 560px; border-radius: 10px; border: 1px solid var(--line); }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { position: sticky; top: 0; background: var(--card-2); text-align: left; font-family: var(--mono); font-weight: 500; font-size: 10px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-3); padding: 9px 10px; border-bottom: 1px solid var(--line-2); cursor: pointer; white-space: nowrap; user-select: none; }
table.t th.num, table.t td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t th .ar { opacity: .8; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
table.t td.doc { color: var(--ink); max-width: 420px; }
table.t td.doc small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: rgba(255,255,255,.025); }
.pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--card-2); border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill.stall { border-color: rgba(236,131,90,.5); color: var(--serious); }
.pill.cancel { border-color: rgba(208,59,59,.5); color: #f08080; }
.tbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.pager { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.meter { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; min-width: 60px; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 99px; }

.watchbtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: 11.5px; cursor: pointer; }
.watchbtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.watchbtn.warn i { background: var(--warn); } .watchbtn.fail i { background: var(--critical); }
.modal { position: fixed; inset: 0; z-index: 90; background: rgba(4,8,12,.6); backdrop-filter: blur(3px); display: grid; place-items: start center; padding: 60px 16px; overflow: auto; }
.mbox { width: min(720px, 100%); padding: 18px; }
.wrow { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.wrow .st { flex: none; font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px; width: 44px; padding-top: 2px; color: var(--ink-3); }
.wrow .st.ok { color: #6bd46b; } .wrow .st.warn { color: var(--warn); } .wrow .st.fail { color: #f08080; }
.wrow b { color: #fff; font-weight: 600; font-size: 13.5px; } .wrow div div { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
/* ---------- glance tiles ---------- */
.icards { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tile { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; color: inherit; cursor: pointer; padding: 14px 15px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); transition: border-color .15s, transform .15s; min-width: 0; }
.tile:hover { border-color: var(--line-2); transform: translateY(-1px); }
.tile .t-top { display: flex; align-items: center; gap: 8px; }
.tile .ic { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(95,185,70,.12); color: var(--brand-ink); }
.tile.warn .ic { background: rgba(236,131,90,.14); color: var(--serious); } .tile.hot .ic { background: rgba(250,178,25,.14); color: var(--warn); }
.tile .t-title { font-family: var(--mono); font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--ink-3); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge-s { flex: none; font-family: var(--mono); font-size: 9.5px; letter-spacing: .8px; padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(250,178,25,.5); color: var(--warn); text-transform: uppercase; }
.tile.hot .badge-s { background: rgba(250,178,25,.14); }
.t-body { display: flex; flex-direction: column; gap: 10px; }
.tile.side .t-body { flex-direction: row; align-items: center; justify-content: space-between; }
.t-main { min-width: 0; }
.t-big { font-family: var(--display); font-weight: 600; font-size: 38px; line-height: 1; color: #fff; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
.t-big small { font-size: 16px; color: var(--ink-2); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.t-big.long { font-size: 28px; white-space: nowrap; }
.t-big.txt { font-size: 26px; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-lab { font-size: 13px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.t-sub { font-size: 12px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--card-2); color: var(--ink); }
.chip em { font-style: normal; font-weight: 500; color: var(--ink-3); }
.chip.good { background: rgba(12,163,12,.16); color: #7ee07e; } .chip.bad { background: rgba(208,59,59,.18); color: #ff9a9a; }
.t-viz svg.mini { width: 100%; height: 44px; display: block; }
.t-viz svg.ring { width: 78px; height: 78px; flex: none; display: block; }
.hb { display: grid; gap: 6px; }
.hb-r { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.hb-r span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-r i { height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
.hb-r i b { display: block; height: 100%; border-radius: 99px; background: var(--s1); }
.hb-r em { font-style: normal; color: var(--ink-3); font-size: 11.5px; min-width: 34px; text-align: right; }
.pals { display: flex; align-items: flex-end; gap: 5px; flex-wrap: wrap; }
.pal { width: 22px; height: 26px; border-radius: 4px; border: 1.5px solid var(--line-2); position: relative; overflow: hidden; display: inline-block; }

async function load() {
  const sum = await fetch("api/summary").then((r) => r.json());

  SHIPS = sum.ships.map((s) => s.ship).sort();
  PACKS = await Promise.all(SHIPS.map((s) => fetch(`api/jobs?ship=${encodeURIComponent(s)}`).then((r) => r.json())));

    const iF = p.cols.indexOf("file"), iE = p.cols.indexOf("end_ts");
    ITIN[p.ship] = itinerary(p.data[iE].map((endTs, i) => ({ endTs, file: p.dicts.file[p.data[iF][i]] || null })));

  DERIVED = S.clk;

    const jobs = [];
    // many jobs share a file name: classify each name / account once, not 37,000 times

      const file = p.dicts.file[d.file[i]] || null;
      const pressTs = d.end_ts[i];
      const c = ck ? ck(pressTs) : null;
      const j = {
        ship: p.ship, jobId: d.job_id[i], endTs: c ? c.ts : pressTs, pressTs, tz: c ? c.tz : PRESS_TZ, runS: d.run_s[i], waitS: d.wait_s[i],
        mode: p.dicts.mode[d.mode[i]], user: p.dicts.user[d.user[i]], result: p.dicts.result[d.result[i]], tray: p.dicts.tray[d.tray[i]],
        pages: d.pages[i], sheets: d.sheets[i], outSets: d.out_sets[i], color: d.color[i] || 0, black: d.black[i] || 0,
        feed: d.feed[i] || 0, waste: d.waste[i] || 0, file,

// One pass at load. A key that folds several differently-named files (dated

// a single day's planner.
const docNames = new Map();
function buildDocNames() {
  const files = new Map();
  const shipsOf = new Map();
  for (const j of ALL) { let m = files.get(j.key); if (!m) files.set(j.key, (m = new Map())); const f = j.file || "(no file name)"; m.set(f, (m.get(f) || 0) + 1);
    let sm = shipsOf.get(j.key); if (!sm) shipsOf.set(j.key, (sm = new Map())); sm.set(j.ship, (sm.get(j.ship) || 0) + 1); }
  const CODE = { pr: "Pursuit", jr: "Journey", on: "Onward", qs: "Quest", qt: "Quest" };
  for (const [key, m] of files) {
    const top = [...m.entries()].sort((a, b) => b[1] - a[1]);
    let title = key.replace(/\b\w/g, (c) => c.toUpperCase());
    // "booklet pr" = the Pursuit booklet (PR260327 style codes); only if Pursuit printed most of it
    const code = key.match(/^(.+\S)\s+(pr|jr|on|qs|qt)$/);
    const main = [...(shipsOf.get(key) || new Map()).entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
    if (code && CODE[code[2]] === main) title = `${code[1].replace(/\b\w/g, (c) => c.toUpperCase())} (${main})`;
    docNames.set(key, top.length > 2 ? `${title} · all editions` : top[0][0]);
  }
}
const docLabel = (key) => docNames.get(key) || key;

function prevDelta(curVal, fn) {
  if (S.period === "all") return "";
  const [a, b] = periodRange(); const n = daysBetween(a, b);
  // a month compares with the month before it; a month still filling in
  // (Sep to the 21st) compares per day, never 21 days against 31
  const month = /^\d{4}-\d{2}$/.test(S.period);
  const pm = month ? periodOf(addDays(S.period + "-01", -1), "month") : null;
  const [pa, pb] = month ? pRange(pm, "month") : [addDays(a, -n), addDays(a, -1)];
  const vs = month ? MON3[+pm.slice(5, 7) - 1] : `previous ${n} days`;
  if (pa < DAY_MIN) return `<div class="d">no earlier ${month ? "month" : "period"} on file</div>`;
  const pn = daysBetween(pa, pb);
  let prev = fn(kpis(filtered([pa, pb])));
  if (!prev) return `<div class="d">${vs}: none</div>`;
  const perDay = pn !== n; if (perDay) prev = (prev * n) / pn;
  const ch = Math.round((100 * (curVal - prev)) / prev);
  return `<div class="d dl ${ch > 0 ? "up" : ch < 0 ? "down" : ""}">${ch > 0 ? "▲" : ch < 0 ? "▼" : "="} ${Math.abs(ch)}% vs ${vs}${perDay ? ", per day" : ""}</div>`;
}

  const side = g.viz && g.viz.kind === "ring";
  return `<button class="tile ${c.tone}${side ? " side" : ""}" data-c='${esc(JSON.stringify(c.go))}' title="${esc(c.html.replace(/<[^>]+>/g, ""))}">
    <div class="t-top"><span class="ic">${ICON[ICON_BY[c.icon]] || ICON[c.icon] || ICON.doc}</span><span class="t-title">${esc(c.title)}</span>${g.badge ? `<span class="badge-s">${esc(g.badge)}</span>` : ""}</div>

    <div class="t-say">${c.html}</div></button>`;

function viz(v) {
  const W = 220, H = 44;
  if (v.kind === "spark" || v.kind === "bars") {
    const vals = v.values || []; const n = vals.length; if (!n) return "";
    const max = Math.max(1, ...vals); const bw = W / n; const hi = v.kind === "spark" ? n - 1 : v.hi;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="mini">${vals.map((x, i) => { const h = Math.max(2, (x / max) * (H - 2)); return `<rect x="${i * bw + bw * 0.14}" y="${H - h}" width="${bw * 0.72}" height="${h}" rx="${Math.min(2.5, bw * 0.3)}" fill="${i === hi ? C.brand : C.print}" opacity="${i === hi ? 1 : 0.45}"/>`; }).join("")}</svg>`;
  }
  if (v.kind === "ring") {
    const r = 26, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, v.pct));
    const col = v.tone === "stall" ? C.stall : v.tone === "critical" ? css("--critical") : C.print;
    return `<svg viewBox="0 0 64 64" class="ring"><circle cx="32" cy="32" r="${r}" fill="none" stroke="${C.line2}" stroke-width="8"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * p) / 100} ${c}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Outfit, sans-serif">${p}%</text></svg>`;
  }
  if (v.kind === "hbars") {
    const max = Math.max(1, ...v.rows.map((r) => r.v));
    return `<div class="hb">${v.rows.map((r, i) => `<div class="hb-r"><span>${esc(r.name)}</span><i><b style="width:${(100 * r.v) / max}%;${i ? "" : `background:${C.brand}`}"></b></i><em>${r.v} h</em></div>`).join("")}</div>`;
  }
  if (v.kind === "vs") {
    const max = Math.max(v.a, v.b);
    return `<div class="hb vs"><div class="hb-r"><span>${esc(v.la)}</span><i><b style="width:${(100 * v.a) / max}%;background:${C.stall}"></b></i></div><div class="hb-r"><span>${esc(v.lb)}</span><i><b style="width:${Math.max(2, (100 * v.b) / max)}%"></b></i><em>${esc(v.lbv)}</em></div></div>`;
  }

    return `<div class="pals">${Array.from({ length: Math.min(full, 12) }, () => pal(1)).join("")}${rest ? pal(rest / v.per) : ""}<em>${full ? `${full} pallet${full > 1 ? "s" : ""}${rest ? ` + ${rest}` : ""}` : `${rest} of ${v.per}`}</em></div>`;
  }
  return "";
}

      <div class="legend"><span><i class="dot" style="background:${C.print}"></i>Printing</span><span><i class="dot" style="background:${C.stall}"></i>Stalled</span></div></div>
      <div class="chart" id="chDaily" style="height:430px"></div></div>
    <div class="card panel c4 m-hide"><div class="ph"><div><h2>What stands out</h2><p>For ${S.ships.length && S.ships.length < SHIPS.length ? esc(S.ships.join(" + ")) : `all ${SHIPS.length} ships`}, ${fday(a)} – ${fday(b)}. Tap one to open it. <a href="#" id="toIns">Month by month →</a></p></div></div><div class="insights" id="ins"></div></div>
    <div class="card panel c6"><div class="ph"><div><h2>By department</h2><p>Press account that sent the job. Click to filter.</p></div>${metricSeg("mDept")}</div><div class="chart tall" id="chDept"></div></div>
    <div class="card panel c6"><div class="ph"><div><h2>By document type</h2><p>What was printed, read from the file name. Click to filter.</p></div>${metricSeg("mCat")}</div><div class="chart tall" id="chCat"></div></div>
    ${SHIPS.length > 1 && (!S.ships.length || S.ships.length > 1) ? `<div class="card panel c12"><div class="ph"><div><h2>Ships side by side</h2><p>${metric().label} per ${daysBetween(a, b) <= 62 ? "week" : "month"}. A period cut by the date range is marked "part".</p></div>${metricSeg("mShip")}</div><div class="chart short" id="chShip"></div></div>` : ""}
  </div>
  ${noBase ? `<div class="method">Not enough history on ${k.b.shipsNoBase.join(", ")} to know its normal speed yet, so its time is not split into printing and stalled.</div>` : ""}`;
  ["mDept", "mCat", "mShip"].forEach(wireMetric);

  // daily/weekly/monthly
  const bucket = days <= 62 ? (d) => d : days <= 400 ? (d) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7)); return t.toISOString().slice(0, 10); } : (d) => d.slice(0, 7) + "-01";
  const agg = new Map();
  for (let d = a; d <= b; d = addDays(d, 1)) { const key = bucket(d); if (!agg.has(key)) agg.set(key, { busy: 0, print: 0 }); }
  for (const [d, v] of Object.entries(k.b.days)) { const x = agg.get(bucket(d)); if (x) { x.busy += v.busy; x.print += v.print; } }
  const keys = [...agg.keys()];
  const lbl = (d) => (days <= 62 ? fdayShort(d) : days <= 400 ? fdayShort(d) : MON[+d.slice(5, 7) - 1] + " " + d.slice(2, 4));
  chart("chDaily", {
    grid: { left: 44, right: 12, top: 14, bottom: 30 },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { color: "rgba(255,255,255,.04)" } },
      formatter: (ps) => { const k2 = keys[ps[0].dataIndex], v = agg.get(k2); return `<b>${days <= 62 ? fday(k2) : days <= 400 ? "Week of " + fday(k2) : lbl(k2)}</b><br>Busy <b>${hrs(v.busy)} h</b><br><span style="color:${C.print}">■</span> Printing ${hrs(v.print)} h<br><span style="color:${C.stall}">■</span> Stalled ${hrs(v.busy - v.print)} h`; } },
    xAxis: axis({ type: "category", data: keys.map(lbl), splitLine: { show: false } }),
    yAxis: axis({ type: "value", name: "h", nameTextStyle: { color: C.ink3 }, axisLine: { show: false } }),
    series: [
      { name: "Printing", type: "bar", stack: "t", data: keys.map((x) => +(agg.get(x).print / 3600).toFixed(2)), itemStyle: { color: C.print }, barMaxWidth: 26 },
      { name: "Stalled", type: "bar", stack: "t", data: keys.map((x) => +((agg.get(x).busy - agg.get(x).print) / 3600).toFixed(2)), itemStyle: { color: C.stall, borderRadius: [4, 4, 0, 0] }, barMaxWidth: 26 },
    ],
  }, (p) => { const d = keys[p.dataIndex]; if (days <= 62) set({ day: d }); else if (days <= 400) set({ period: "custom", from: d, to: addDays(d, 6) }); else { const e = new Date(d + "T00:00:00Z"); e.setUTCMonth(e.getUTCMonth() + 1); e.setUTCDate(0); set({ period: "custom", from: d, to: e.toISOString().slice(0, 10) }); } });

  hbar("chDept", groupBy(jobs, (j) => j.dept, metric().get), (name) => set({ depts: [name] }));
  hbar("chCat", groupBy(jobs, (j) => j.cat, metric().get), (name) => set({ cats: [name] }));
  if ($("#chShip")) shipWeekly("chShip", jobs, a, b);
  insights(jobs, k);
  $("#toIns").onclick = (e) => { e.preventDefault(); set({ tab: "insights" }); };
}

// Boxes + pallets, with the assumption named (no paper size in the log).
function paperLine(jobs) {
  const p = paper(jobs);
  const bx = (v) => (v > 0 && v < 1 ? "<1" : n0(v));
  return `<div class="d" title="Paper size is not in the press log. Assumed: fold-tray (booklet) jobs on 11×17 at ${n0(PAPER.tabloidPerBox)} a box; everything else 8.5×11 at ${n0(PAPER.letterPerBox)} a box; ${PAPER.boxesPerPallet} boxes a pallet. Counts paper on cancelled jobs too.">≈ <b style="color:#fff">${bx(p.boxes)} boxes</b> · ${p.pallets >= 1 ? n0(p.pallets) : "<1"} pallet${p.pallets >= 1.5 ? "s" : ""}<br>${bx(p.letterBoxes)} × 8.5×11 · ${bx(p.tabloidBoxes)} × 11×17 <span class="part">assumed ⓘ</span></div>`;
}

function hbar(id, rows, onPick, max = 14) {
  if (PHONE()) max = Math.min(max, 9);
  let data = rows;
  if (rows.length > max) { const rest = rows.slice(max - 1).reduce((s, r) => s + r[1], 0); data = [...rows.slice(0, max - 1), ["All others", rest]]; }
  data = data.slice().reverse();
  const m = metric(); const total = rows.reduce((s, r) => s + r[1], 0);
  chart(id, {
    grid: { left: PHONE() ? 2 : 8, right: 70, top: 6, bottom: 6, containLabel: true },
    tooltip: { trigger: "item", formatter: (p) => `<b>${esc(p.name)}</b><br>${m.fmt(p.value)} · ${pct(p.value, total)}% of the total` },
    xAxis: axis({ type: "value", show: false }),
    yAxis: axis({ type: "category", data: data.map((d) => d[0]), axisLine: { show: false }, axisLabel: { color: C.ink2, fontSize: 12, width: PHONE() ? 118 : 150, overflow: "truncate" } }),
    series: [{ type: "bar", data: data.map((d) => ({ value: d[1], itemStyle: { color: d[0] === "All others" || d[0] === "Other" ? C.line2 : C.print } })), barMaxWidth: 16, itemStyle: { borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: "right", color: C.ink2, fontSize: 11.5, formatter: (p) => m.fmt(p.value) } }],
  }, (p) => { if (p.name !== "All others") onPick(p.name); });
}

function weekStart(d) { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7)); return t.toISOString().slice(0, 10); }
function shipWeekly(id, jobs, a, b) {
  const weekly = daysBetween(a, b) <= 62;
  const keyOf = weekly ? (d) => weekStart(d) : (d) => d.slice(0, 7);
  const periods = []; for (let d = a; d <= b; d = addDays(d, 1)) { const k2 = keyOf(d); if (periods[periods.length - 1] !== k2) periods.push(k2); }
  const partial = (p) => weekly ? (p < a || addDays(p, 6) > b) : (a > p + "-01" || b < new Date(Date.UTC(+p.slice(0, 4), +p.slice(5, 7), 0)).toISOString().slice(0, 10));
  const label = (p) => (weekly ? fdayShort(p) : MON[+p.slice(5, 7) - 1] + " " + p.slice(2, 4)) + (partial(p) ? " (part)" : "");
  const m = metric(); const ships = SHIPS.filter((s) => !S.ships.length || S.ships.includes(s));
  chart(id, {
    grid: { left: 50, right: 12, top: 30, bottom: 30 },
    legend: { top: 0, right: 0, textStyle: { color: C.ink2, fontSize: 12 }, itemWidth: 10, itemHeight: 10, icon: "roundRect" },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { color: "rgba(255,255,255,.04)" } }, valueFormatter: (v) => m.fmt(v) },
    xAxis: axis({ type: "category", data: periods.map(label), splitLine: { show: false } }),
    yAxis: axis({ type: "value", axisLine: { show: false } }),
    series: ships.map((s) => {
      const g = new Map(groupBy(jobs.filter((j) => j.ship === s), (j) => keyOf(j.day), m.get));
      return { name: s, type: "bar", barGap: "12%", barMaxWidth: 18, itemStyle: { color: shipColor(s), borderRadius: [4, 4, 0, 0] }, data: periods.map((p) => +(g.get(p) || 0).toFixed(2)) };
    }),
  });
}

function insights(jobs, k) {
  const out = [];
  const add = (icon, html, go, warn) => out.push({ icon, html, go, warn });
  // busiest hour
  let best = null; for (const [key, s] of Object.entries(k.b.heat)) if (!best || s > best[1]) best = [key, s];
  if (best) { const [wd, h] = best[0].split("|").map(Number); add(ICON.clock, `Busiest hour of the week: <b>${WD[wd]} ${hh(h)}–${hh((h + 1) % 24)}</b>.`, () => set({ tab: "workload" })); }
  // stall
  if (!k.b.shipsNoBase.length && k.b.busyS) {
    const big = jobs.filter((j) => (j.stallS || 0) >= 3600);
    add(ICON.alert, `<b>${pct(k.b.stallS, k.b.busyS)}%</b> of press time was stalled. <b>${n0(big.length)} jobs</b> sat more than an hour past normal.`, () => set({ tab: "stalls" }), true);
  }
  // top dept by hours
  const d = groupBy(jobs, (j) => j.dept, (j) => j.runS || 0)[0];
  const tot = jobs.reduce((s, j) => s + (j.runS || 0), 0);
  if (d) add(ICON.people, `<b>${esc(d[0])}</b> takes the most press time: <b>${hrs(d[1])} h</b>, ${pct(d[1], tot)}% of the total.`, () => set({ depts: [d[0]] }));
  // most repeated doc
  const docs = groupBy(jobs.filter((j) => j.key !== "(no file name)" && j.cat !== "Test Pattern / Copy"), (j) => j.key, () => 1);
  if (docs[0]) add(ICON.doc, `Most repeated document: <b>${esc(docLabel(docs[0][0]))}</b>, printed <b>${n0(docs[0][1])} times</b>.`, () => set({ doc: docs[0][0], tab: "printed" }));
  // slowest type (median, completed print jobs, ≥ 20 jobs)
  const byCat = {}; for (const j of jobs) if (j.result === "Complete" && j.runS != null && j.cat !== "Test Pattern / Copy") (byCat[j.cat] ||= []).push(j.runS);
  const med = Object.entries(byCat).filter(([, v]) => v.length >= 20).map(([c, v]) => [c, quantile(v.sort((x, y) => x - y), 0.5)]).sort((x, y) => y[1] - x[1]);
  if (med[0]) add(ICON.cal, `Longest typical job: <b>${esc(med[0][0])}</b>, ${dur(med[0][1])} per job. Quickest: ${esc(med[med.length - 1][0])}, ${dur(med[med.length - 1][1])}.`, () => set({ tab: "printed" }));
  // cancels
  if (k.cancels) add(ICON.drop, `<b>${n0(k.cancels)} jobs</b> were cancelled (${pct(k.cancels, k.jobs)}% of all jobs). <b>${n0(k.waste)}</b> sheets wasted.`, () => set({ tab: "cancels" }), true);
  $("#ins").innerHTML = out.map((o, i) => `<button class="ins" data-i="${i}"><span class="ic ${o.warn ? "warn" : ""}">${o.icon}</span><div>${o.html}</div></button>`).join("");
  $$("#ins .ins").forEach((el) => (el.onclick = () => out[+el.dataset.i].go()));
}

// ---- Working hours: how each press's day actually runs
// end of day reads 24:00, never a second 00:00
const clock = (sec) => { if (sec == null) return "—"; const m = Math.round(sec / 60); return `${String(Math.min(24, Math.floor(m / 60))).padStart(2, "0")}:${String(m >= 1440 ? 0 : m % 60).padStart(2, "0")}`; };
const med = (arr) => quantile(arr.slice().sort((x, y) => x - y), 0.5);
// Phone: ships × weekdays, each cell the typical hours worked. Colour = how busy.
function weekGrid(ships, pdays) {
  const cells = ships.map((s) => WD.map((_, wd) => { const v = pdays.filter((x) => x.s === s && (new Date(x.d + "T00:00:00Z").getUTCDay() + 6) % 7 === wd).map((x) => x.busy); return v.length ? med(v) : null; }));
  const max = Math.max(1, ...cells.flat().filter((x) => x != null));
  const idx = (v) => Math.min(RAMP.length - 1, 1 + Math.round(((RAMP.length - 2) * v) / max));
  const col = (v) => RAMP[idx(v)];
  return `<div class="wg"><span></span>${WD.map((w) => `<span class="wg-h">${w[0]}</span>`).join("")}${ships.map((s, i) => `<span class="wg-s"><i class="dot" style="background:${shipColor(s)}"></i>${esc(s)}</span>${cells[i].map((v) => `<span class="wg-c" style="background:${v == null ? "transparent" : col(v)};color:${v != null && idx(v) >= 5 ? "#0a0f16" : "#fff"}">${v == null ? "–" : Math.round(v / 3600)}</span>`).join("")}`).join("")}</div><div class="wg-k">hours worked on a typical day</div>`;
}
function workload({ jobs, a, b, k }) {
  const ships = [...new Set(jobs.map((j) => j.ship))].sort();
  const prof = {}; for (const s of ships) prof[s] = dayProfiles(jobs.filter((j) => j.ship === s), BASE[s]);
  const pdays = []; for (const s of ships) for (const [d, v] of Object.entries(prof[s])) if (d >= a && d <= b) pdays.push({ s, d, ...v });
  const nDays = daysBetween(a, b);
  const wship = ships.includes(S.wship) ? S.wship : ships[0];
  const allDays = [...new Set(pdays.map((x) => x.d))].sort();
  const gday = allDays.includes(S.gday) ? S.gday : allDays[allDays.length - 1];
  const top = pdays.slice().sort((x, y) => y.busy - x.busy)[0];
  // "Busiest day" = the most printing; a job stuck for 12 h is not a busy day
  const topPrint = pdays.slice().sort((x, y) => (y.busy - (y.stall || 0)) - (x.busy - (x.stall || 0)))[0];
  const sumBusy = pdays.reduce((t, x) => t + x.busy, 0), sumWin = pdays.reduce((t, x) => t + x.window, 0);
  const perShipDays = ships.map((s) => pdays.filter((x) => x.s === s).length);
  const noBase = ships.filter((s) => !BASE[s]);
  const wdCount = new Array(7).fill(0); for (let d = a; d <= b; d = addDays(d, 1)) wdCount[(new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7]++;

  $("#tab").innerHTML = `
  <div class="kpis">
    <div class="card kpi" style="--kc:${C.print}"><div class="v">${dur(med(pdays.map((x) => x.busy))).replace(/ (h|min)/g, "<small>$1</small>")}</div><div class="l">worked per press, per day</div><div class="d">typical day with printing</div></div>
    <div class="card kpi"><div class="v">${dur(med(pdays.map((x) => x.window))).replace(/ (h|min)/g, "<small>$1</small>")}</div><div class="l">working window</div><div class="d">first job start → last job end</div></div>
    <div class="card kpi"><div class="v">${pct(sumBusy, sumWin)}<small>%</small></div><div class="l">of the window actually printing</div><div class="d">the rest is idle between jobs</div></div>
    <div class="card kpi"><div class="v tight">${clock(med(pdays.map((x) => x.first)))}<small>→</small>${clock(med(pdays.map((x) => x.last)))}</div><div class="l">typical start → finish</div><div class="d">${S.clk === "press" ? "press clock (UTC−5)" : "ship time"}</div></div>
    <div class="card kpi"><div class="v">${Math.round(perShipDays.reduce((t, x) => t + x, 0) / Math.max(1, ships.length))}<small>/ ${nDays}</small></div><div class="l">days worked, per press</div><div class="d">${ships.length > 1 ? ships.map((s, i) => `${esc(s)} ${perShipDays[i]}${missingIn(s, a, b) ? ` <span class="warnt">(${missingIn(s, a, b)} not logged)</span>` : ""}`).join(" · ") : "days with at least one job"}</div>${ships.some((s) => missingIn(s, a, b)) ? `<div class="gapnote">⚠ ${ships.filter((s) => missingIn(s, a, b)).map((s) => `${esc(s)}: ${missingIn(s, a, b)} days no log`).join(" · ")}</div>` : ""}</div>
    <div class="card kpi" style="--kc:${C.stall}"><div class="v">${noBase.length ? "—" : dur(med(pdays.map((x) => x.stall))).replace(/ (h|min|s)$/g, "<small>$1</small>")}</div><div class="l">stalled, per press per day</div><div class="d">${top ? `longest day: ${dur(top.busy)} · ${esc(top.s)} ${fdayShort(top.d)}` : ""}</div></div>
  </div>

  <div class="grid" style="margin-top:14px">
    <div class="card panel c12"><div class="ph"><div><h2>A day on the presses</h2><p>Every job on ${gday ? `<b style="color:#fff">${WD[(new Date(gday + "T00:00:00Z").getUTCDay() + 6) % 7]} ${fday(gday)}</b>` : "—"}, hour by hour. Blue is printing, orange is stalled; gaps are the press standing idle. Tap or hover a block for the job.</p></div>
      <div class="dnav"><button class="btn" id="gPrev" aria-label="Previous day">‹</button><div class="dnav-d">${gday ? `<b>${WD[(new Date(gday + "T00:00:00Z").getUTCDay() + 6) % 7]} ${fdayShort(gday)}</b><small>${gday.slice(0, 4)}${gday === topPrint?.d ? " · busiest" : ""}</small>` : "—"}</div><button class="btn" id="gNext" aria-label="Next day">›</button><button class="btn chipbtn" id="gBusy" title="The day with the most printing">★ Busiest</button></div></div>
      <div class="chart gantt" id="chGantt" style="height:${90 + 46 * Math.max(1, ships.length)}px;--gh:${50 + 40 * Math.max(1, ships.length)}px"></div>
      <div id="gSum" class="gsum"></div></div>

    <div class="card panel c12"><div class="ph"><div><h2>Every day at a glance</h2><p>One column per day, midnight at the top. Each coloured band is time the press was working — a shift that moves, a late night, a day off all show as a pattern. Click a day to open it above.</p></div>
      ${ships.length > 1 ? `<div class="seg" id="wShip">${ships.map((s) => `<button data-s="${esc(s)}" class="${s === wship ? "on" : ""}"><span class="dot" style="background:${shipColor(s)}"></span>${esc(s)}</button>`).join("")}</div>` : ""}</div>
      <div class="chart" id="chActo" style="height:360px"></div></div>

    <div class="card panel c8"><div class="ph"><div><h2>Hours worked, day by day — ${esc(wship)}</h2><p>Busy hours each day, printing and stalled. The line is ${esc(wship)}'s typical day.</p></div>
      <div class="legend"><span><i class="dot" style="background:${C.print}"></i>Printing</span><span><i class="dot" style="background:${C.stall}"></i>Stalled</span></div></div>
      <div class="chart" id="chDayHrs"></div></div>
    <div class="card panel c4"><div class="ph"><div><h2>How long a working day is</h2><p>Days by hours worked, ${esc(wship)}.</p></div></div><div class="chart" id="chHist"></div></div>

    <div class="card panel c12"><div class="ph"><div><h2>Each press's week</h2><p>Typical (median) day for each weekday, days with printing only.</p></div></div>
      <div class="m-only wkgrid">${weekGrid(ships, pdays)}</div>
      <div class="tbl-wrap d-only"><table class="t"><thead><tr><th>Ship</th>${WD.map((w) => `<th class="num">${w}</th>`).join("")}<th class="num">Start</th><th class="num">Finish</th><th class="num">Busiest 10%</th></tr></thead><tbody>
      ${ships.map((s) => { const ds = pdays.filter((x) => x.s === s); return `<tr><td><span class="dot" style="background:${shipColor(s)}"></span> ${esc(s)}</td>${WD.map((_, wd) => { const v = ds.filter((x) => (new Date(x.d + "T00:00:00Z").getUTCDay() + 6) % 7 === wd); return `<td class="num">${v.length ? `<b style="color:#fff">${dur(med(v.map((x) => x.busy)))}</b><div class="muted" style="font-size:11px">${v.length}/${wdCount[wd]} days</div>` : "—"}</td>`; }).join("")}<td class="num">${clock(med(ds.map((x) => x.first)))}</td><td class="num">${clock(med(ds.map((x) => x.last)))}</td><td class="num">${dur(quantile(ds.map((x) => x.busy).sort((x, y) => x - y), 0.9))}</td></tr>`; }).join("")}
      </tbody></table></div>
      <div class="method">All hours are <b>machine time</b> from the press's own start and end times, ${S.clk === "press" ? "on the raw press clock (fixed UTC−5 on every ship)" : `in <b>ship time</b>: the press clock is fixed on UTC−5 (Miami winter time), so each job is moved to the time zone of the port the ship's own day planners and inserts name for that day${(() => { const q = placedShare(ships, a, b); return q.n ? ` — ${pct(q.port, q.n)}% of these ship-days are named by a document; the rest carry the nearest port's zone (marked est.)` : ""; })()}`}. The log does not record who stood at the press, so these are not labour hours. A job across midnight counts on both days.</div></div>

    <div class="card panel c12"><div class="ph"><div><h2>When the press is busy</h2><p>Average minutes busy in each hour, per press, over ${n0(nDays)} days. Darker = busier. Click a cell to see the jobs that started in that hour.</p></div></div><div class="chart" id="chHeat" style="height:300px"></div></div>
    <div class="card panel c12"><div class="ph"><div><h2>Busiest days</h2><p>Click a day to open it on the timeline.</p></div></div>
      <div class="m-only legend" style="margin-bottom:4px"><span><i class="dot" style="background:${C.print}"></i>Printing</span><span><i class="dot" style="background:${C.stall}"></i>Stalled</span></div>
      <div class="m-only" id="mDays"></div>
      <div class="tbl-wrap d-only" style="max-height:420px"><table class="t" id="tDays"></table></div></div>
  </div>`;

  // ---- day timeline (Gantt)
  const di = allDays.indexOf(gday);
  $("#gPrev").disabled = di <= 0; $("#gNext").disabled = di < 0 || di >= allDays.length - 1;
  $("#gPrev").onclick = () => set({ gday: allDays[di - 1] });
  $("#gNext").onclick = () => set({ gday: allDays[di + 1] });
  $("#gBusy").onclick = () => set({ gday: topPrint?.d });
  const d0 = Date.parse(gday + "T00:00:00Z");
  const blocks = [];
  for (const j of jobs) {
    if (j.startMs == null || j.runS <= 0) continue;
    const st = j.startMs, en = j.endMs;
    if (en <= d0 || st >= d0 + 86400000) continue;
    const row = ships.indexOf(j.ship); if (row < 0) continue;
    const pEnd = st + (j.printS || 0) * 1000;
    const seg = (x, y, kind) => { const A = Math.max(x, d0), B = Math.min(y, d0 + 86400000); if (B > A) blocks.push({ value: [row, (A - d0) / 3600000, (B - d0) / 3600000], kind, j }); };
    seg(st, pEnd, "print"); if (j.stallS > 0) seg(pEnd, en, "stall");
  }
  ships.forEach((s, row) => { if (MISSING[s]?.has(gday)) blocks.push({ value: [row, 0, 24], kind: "gap", j: null }); });
  const phone = matchMedia("(max-width: 700px)").matches;
  const H = phone ? 16 : 22;
  chart("chGantt", {
    grid: { left: phone ? 62 : 80, right: phone ? 10 : 16, top: 10, bottom: 26 },
    tooltip: { formatter: (p) => { const j = p.data.j; if (!j) return "The press logged no jobs in this stretch. A re-export (24 Sep) returned nothing either: dry dock, press off or log reset — to confirm with the ship."; return `<b>${esc(j.file || "(no file name)")}</b><br>${esc(j.ship)} · ${esc(j.dept)} · ${esc(j.cat)}<br>${new Date(j.startMs).toISOString().slice(11, 16)} → ${j.endTs.slice(11, 16)} · ${dur(j.runS)} · ${n0(j.feed)} sheets${j.stallS >= STALL_JOB_S ? `<br><span style="color:${C.stall}">stalled ${dur(j.stallS)} past normal (${dur(j.expS)})</span>` : ""}`; } },
    xAxis: axis({ type: "value", min: 0, max: 24, interval: phone ? 6 : 2, axisLabel: { color: C.ink3, fontSize: 11, formatter: (v) => phone ? String(v).padStart(2, "0") : `${String(v).padStart(2, "0")}:00` } }),
    yAxis: axis({ type: "category", data: ships, inverse: true, axisLine: { show: false }, splitLine: { show: false }, axisLabel: { color: C.ink2, fontSize: phone ? 12 : 12.5 } }),
    series: [{ type: "custom", progressive: 0, data: blocks, encode: { x: [1, 2], y: 0 },
      renderItem: (params, api) => { const s0 = api.coord([api.value(1), api.value(0)]), s1 = api.coord([api.value(2), api.value(0)]); const kind = blocks[params.dataIndex].kind;
        if (kind === "gap") return { type: "group", children: [
          { type: "rect", shape: { x: s0[0], y: s0[1] - H / 2, width: s1[0] - s0[0], height: H, r: 4 }, style: { fill: "rgba(240,180,60,.06)", stroke: "rgba(240,180,60,.45)", lineWidth: 1, lineDash: [4, 4] } },
          { type: "text", style: { text: "the press logged no jobs this day", x: (s0[0] + s1[0]) / 2, y: s0[1], align: "center", verticalAlign: "middle", fill: "#f0c46a", font: "12px DM Sans, system-ui, sans-serif" } }] };
        return { type: "rect", shape: { x: s0[0], y: s0[1] - H / 2, width: Math.max(1.5, s1[0] - s0[0]), height: H, r: 3 }, style: { fill: kind === "print" ? C.print : C.stall, stroke: css("--card"), lineWidth: 1 } }; } }],
  });
  const hm = (sec) => { const m = Math.round(sec / 60); return m < 1 ? "<1m" : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
  $("#gSum").innerHTML = ships.map((s) => { const p = prof[s][gday]; const w = whereOf(s, gday); const st = p && p.stall >= 60 && BASE[s] ? p.stall : 0;
    const gap = !p && MISSING[s]?.get(gday);
    return `<div class="gs${p ? "" : " off"}${gap ? " gap" : ""}"><div class="gs-a"><i class="dot" style="background:${shipColor(s)}"></i><b>${esc(s)}</b><span class="gs-t">${p ? `${clock(p.first)}–${clock(p.last)}` : gap ? "press logged nothing" : "no printing"}</span></div>
      <div class="gs-h">${p ? hm(p.busy - st) : "–"}${st ? `<em>+${hm(st)} stalled</em>` : ""}</div>
      <div class="gs-w${w?.est ? " est" : ""}">${gap ? `⚠ ${fdayShort(gap.from)} – ${fdayShort(gap.to)} · ${gap.n} days, no log` : w ? `⚓ <span>${esc(w.place)}</span> · ${w.off}${w.est ? " · est." : ""}` : "press clock · UTC−5"}</div></div>`; }).join("");
  const ws = $("#wShip"); if (ws) ws.onclick = (e) => { const bt = e.target.closest("button"); if (bt) set({ wship: bt.dataset.s }); };

  // ---- actogram: one column per day, 00 at top
  const days = []; for (let d = a; d <= b; d = addDays(d, 1)) days.push(d);
  const P = prof[wship] || {};
  const bands = []; for (const [i, d] of days.entries()) { const p = P[d]; if (p) for (const [x, y] of p.iv) bands.push([i, x / 3600, y / 3600]); }
  chart("chActo", {
    grid: { left: 46, right: 12, top: 8, bottom: 30 },
    tooltip: { formatter: (p) => { const d = days[p.value[0]], q = P[d]; return `<b>${WD[(new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7]} ${fday(d)}</b><br>${clock(q.first)} → ${clock(q.last)}<br>worked ${dur(q.busy)}${q.stall >= 60 && BASE[wship] ? `, ${dur(q.stall)} stalled` : ""}`; } },
    xAxis: axis({ type: "category", data: days.map(fdayShort), splitLine: { show: false }, axisLabel: { color: C.ink3, fontSize: 10.5 } }),
    yAxis: axis({ type: "value", min: 0, max: 24, interval: 3, inverse: true, axisLine: { show: false }, axisLabel: { color: C.ink3, fontSize: 10.5, formatter: (v) => `${String(v).padStart(2, "0")}:00` } }),
    series: [{ type: "custom", progressive: 0, data: bands, encode: { x: 0, y: [1, 2] },
      renderItem: (params, api) => { const w = Math.max(1, api.size([1, 0])[0] * 0.78); const p0 = api.coord([api.value(0), api.value(1)]), p1 = api.coord([api.value(0), api.value(2)]);
        return { type: "rect", shape: { x: p0[0] - w / 2, y: p0[1], width: w, height: Math.max(1, p1[1] - p0[1]) }, style: { fill: shipColor(wship) } }; } }],
  }, (p) => set({ gday: days[p.value[0]] }));

  // ---- hours worked per day, and the spread
  const dh = days.map((d) => P[d] || null);
  const typical = med(Object.entries(P).filter(([d]) => d >= a && d <= b).map(([, v]) => v.busy)) || 0;
  chart("chDayHrs", {
    grid: { left: 40, right: 12, top: 14, bottom: 30 },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { color: "rgba(255,255,255,.04)" } }, formatter: (ps) => { const i = ps[0].dataIndex, q = dh[i]; return `<b>${fday(days[i])}</b><br>${q ? `worked ${dur(q.busy)} · ${clock(q.first)}→${clock(q.last)}` : "no jobs"}`; } },
    xAxis: axis({ type: "category", data: days.map(fdayShort), splitLine: { show: false } }),
    yAxis: axis({ type: "value", name: "h", nameTextStyle: { color: C.ink3 }, axisLine: { show: false } }),
    series: [
      { type: "bar", stack: "h", barMaxWidth: 14, itemStyle: { color: C.print }, data: dh.map((q) => (q ? +(q.print / 3600).toFixed(2) : 0)),
        markLine: { symbol: "none", silent: true, lineStyle: { color: C.ink2, type: "solid", width: 1 }, label: { color: C.ink2, formatter: `typical ${dur(typical)}`, position: "insideEndTop" }, data: [{ yAxis: +(typical / 3600).toFixed(2) }] } },
      { type: "bar", stack: "h", barMaxWidth: 14, itemStyle: { color: C.stall, borderRadius: [3, 3, 0, 0] }, data: dh.map((q) => (q && BASE[wship] ? +(q.stall / 3600).toFixed(2) : 0)) },
    ],
  }, (p) => set({ gday: days[p.dataIndex] }));
  const bins = ["<1 h", "1–2", "2–4", "4–6", "6–8", "8–12", "12+ h"], edges = [1, 2, 4, 6, 8, 12, Infinity];
  const counts = new Array(bins.length).fill(0);
  for (const q of Object.entries(P).filter(([d]) => d >= a && d <= b).map(([, v]) => v.busy / 3600)) counts[edges.findIndex((e) => q < e)]++;
  const idle = days.length - Object.keys(P).filter((d) => d >= a && d <= b).length;
  chart("chHist", {
    grid: { left: 36, right: 10, top: 14, bottom: 30 },
    tooltip: { trigger: "axis", axisPointer: { type: "shadow", shadowStyle: { color: "rgba(255,255,255,.04)" } }, formatter: (ps) => `<b>${ps[0].name}</b><br>${ps[0].value} days` },
    xAxis: axis({ type: "category", data: ["none", ...bins], splitLine: { show: false } }),
    yAxis: axis({ type: "value", axisLine: { show: false }, minInterval: 1 }),
    series: [{ type: "bar", barMaxWidth: 26, data: [{ value: idle, itemStyle: { color: C.line2 } }, ...counts.map((v) => ({ value: v, itemStyle: { color: C.print } }))], itemStyle: { borderRadius: [4, 4, 0, 0] } }],
  });

  // ---- heatmap (unchanged meaning): avg busy minutes per (weekday,hour) per press
  const nPress = Math.max(1, ships.length);
  const data = []; let vmax = 0;
  for (let wd = 0; wd < 7; wd++) for (let h = 0; h < 24; h++) { const v = (k.b.heat[`${wd}|${h}`] || 0) / 60 / Math.max(1, wdCount[wd]) / nPress; vmax = Math.max(vmax, v); data.push([h, wd, +v.toFixed(1)]); }
  const phoneH = matchMedia("(max-width: 700px)").matches;
  chart("chHeat", {
    grid: { left: phoneH ? 36 : 44, right: phoneH ? 6 : 16, top: 6, bottom: 56 },
    tooltip: { formatter: (p) => `<b>${WD[p.value[1]]} ${hh(p.value[0])}–${hh((p.value[0] + 1) % 24)}</b><br>${Math.round(p.value[2])} min busy on average` },
    xAxis: { type: "category", data: [...Array(24).keys()].map((h) => String(h).padStart(2, "0")), axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: C.ink3, fontSize: 11, interval: phoneH ? 5 : 0 } },
    yAxis: { type: "category", data: WD, inverse: true, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: C.ink2, fontSize: 11.5 } },
    visualMap: { min: 0, max: Math.max(1, Math.ceil(vmax)), orient: "horizontal", left: "center", bottom: 4, itemHeight: 180, itemWidth: 10, text: [`${Math.ceil(vmax)} min`, "0"], textStyle: { color: C.ink3, fontSize: 11 }, inRange: { color: RAMP } },
    series: [{ type: "heatmap", data, itemStyle: { borderColor: css("--card"), borderWidth: phoneH ? 1 : 2, borderRadius: phoneH ? 2 : 4 } }],
  }, (p) => set({ wd: String(p.value[1]), hour: String(p.value[0]), tab: "jobs" }));

  // ---- busiest days
  // busiest = most printing; stalled time shows in orange but does not make a day "busy"
  const printOf = (r) => r.busy - (r.stall && BASE[r.s] ? r.stall : 0);
  const topDays = pdays.slice().sort((x, y) => printOf(y) - printOf(x)).slice(0, 40);
  const maxS = Math.max(1, ...topDays.map((r) => r.busy));
  $("#tDays").innerHTML = `<thead><tr><th>Day</th><th>Ship</th><th class="num">Worked</th><th></th><th class="num">of it stalled</th><th class="num">Start → finish</th><th class="num">Jobs</th><th>Most time went to</th></tr></thead><tbody>${topDays.map((r) => {
    const js = jobs.filter((j) => j.day === r.d && j.ship === r.s); const main = groupBy(js, (j) => j.cat, (j) => j.runS || 0)[0];
    return `<tr class="click" data-d="${r.d}"><td>${WD[(new Date(r.d + "T00:00:00Z").getUTCDay() + 6) % 7]} ${fday(r.d)}</td><td><span class="dot" style="background:${shipColor(r.s)}"></span> ${esc(r.s)}</td><td class="num"><b style="color:#fff">${dur(r.busy)}</b></td><td style="width:14%"><div class="meter"><i style="width:${(100 * r.busy) / maxS}%"></i></div></td><td class="num">${r.stall >= 60 && BASE[r.s] ? `<span class="pill stall">${dur(r.stall)}</span>` : "—"}</td><td class="num">${clock(r.first)} → ${clock(r.last)}</td><td class="num">${n0(js.length)}</td><td>${esc(main?.[0] || "—")}</td></tr>`; }).join("")}</tbody>`;
  $$("#tDays tr.click").forEach((tr) => (tr.onclick = () => { set({ gday: tr.dataset.d }); scrollTo({ top: 0, behavior: "smooth" }); }));
  $("#mDays").innerHTML = topDays.slice(0, 12).map((r) => `<button class="drow" data-d="${r.d}"><span class="dd-d"><b>${WD[(new Date(r.d + "T00:00:00Z").getUTCDay() + 6) % 7]}</b>${fdayShort(r.d)}</span><span class="dd-s"><i class="dot" style="background:${shipColor(r.s)}"></i>${esc(r.s)}</span><span class="dd-bar"><i style="width:${(100 * r.busy) / maxS}%"><b style="width:${r.busy ? (100 * Math.max(0, r.stall || 0)) / r.busy : 0}%"></b></i></span><span class="dd-h">${(printOf(r) / 3600).toFixed(printOf(r) < 36000 ? 1 : 0)}h</span></button>`).join("");
  $$("#mDays .drow").forEach((b) => (b.onclick = () => { set({ gday: b.dataset.d }); scrollTo({ top: 0, behavior: "smooth" }); }));
}

// ---- What's printed
let docSort = { k: "n", dir: -1 };
function printed({ jobs }) {
  $("#tab").innerHTML = `
  <div class="grid">
    <div class="card panel c5"><div class="ph"><div><h2>Document types</h2><p>Click a bar to filter.</p></div>${metricSeg("mCat2")}</div><div class="chart tall" id="chCat2"></div></div>

      <input class="ctl" id="docQ" placeholder="Find a document…" style="min-width:220px"></div>

    <div class="card panel c12"><div class="ph"><div><h2>Who prints what</h2><p>${metric().label} by department and document type.</p></div><span class="d-only">${metricSeg("mMx")}</span></div><div class="d-only"><div class="chart" id="chMx" style="height:460px"></div></div><div class="m-only" id="mMxList"></div></div>
  </div>`;

  const cats = Object.entries(byCat).filter(([, v]) => v.length >= 5).map(([c, v]) => [c, v.sort((x, y) => x - y)]).sort((x, y) => quantile(y[1], 0.5) - quantile(x[1], 0.5));
  const box = cats.map(([, v]) => [quantile(v, 0.05), quantile(v, 0.25), quantile(v, 0.5), quantile(v, 0.75), quantile(v, 0.95)].map((x) => Math.max(0.05, x)));
  chart("chBox", {
    grid: { left: 168, right: 20, top: 10, bottom: 34 },
    tooltip: { trigger: "item", formatter: (p) => { const [c, v] = cats[p.dataIndex]; return `<b>${esc(c)}</b> · ${n0(v.length)} jobs<br>Typical: <b>${dur(quantile(v, 0.5) * 60)}</b><br>Middle half: ${dur(quantile(v, 0.25) * 60)} – ${dur(quantile(v, 0.75) * 60)}<br>Shortest: ${dur(v[0] * 60)} · Longest: ${dur(v[v.length - 1] * 60)}`; } },
    xAxis: axis({ type: "log", logBase: 10, min: 0.1, name: "minutes (log scale)", nameLocation: "middle", nameGap: 24, nameTextStyle: { color: C.ink3, fontSize: 11 }, axisLabel: { color: C.ink3, fontSize: 11, formatter: (v) => (v < 1 ? `${Math.round(v * 60)}s` : v >= 60 ? `${Math.round(v / 60)}h` : `${v}m`) } }),
    yAxis: axis({ type: "category", data: cats.map(([c]) => c), inverse: true, axisLine: { show: false }, axisLabel: { color: C.ink2, fontSize: 12 } }),
    series: [{ type: "boxplot", data: box, boxWidth: [6, 14], itemStyle: { color: "rgba(57,135,229,.25)", borderColor: C.print, borderWidth: 1.5 } }],
  }, (p) => set({ cats: [cats[p.dataIndex][0]] }));
  const topMed = Math.max(1, ...cats.map(([, v]) => quantile(v, 0.5)));
  $("#mBox").innerHTML = `<div class="mk">typical time for one job</div>` + cats.slice().reverse().map(([c, v]) => { const m2 = quantile(v, 0.5); return `<button class="mrow" data-c="${esc(c)}"><span class="mr-main"><b>${esc(c)}</b><span class="mr-bar"><i style="width:${Math.max(2, (100 * m2) / topMed)}%"></i></span><small>${n0(v.length)} jobs</small></span><span class="mr-big sm">${hmS(m2 * 60)}</span></button>`; }).join("");
  $$("#mBox .mrow").forEach((b) => (b.onclick = () => set({ cats: [b.dataset.c] })));
  capList($("#mBox"), 10);

  // documents table
  const g = new Map();
  for (const j of jobs) {

  });
  const drawDocs = () => {
