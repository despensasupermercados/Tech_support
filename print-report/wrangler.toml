name = "cims-print"
account_id = "7148946ab624fb49a34c77bb04c2f3a7"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# ROUTE IS NOT MANAGED FROM CI. Attach once in the Cloudflare dashboard:
#   Workers & Pages → cims-print → Settings → Domains & Routes → Add route
#   hon.cims.work/print*   (zone cims.work)
# The more specific route wins over HON's custom domain, so /print goes here and
# every other HON path is untouched.

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[observability]
enabled = true

# Created 2026-09-23 (APAC, same account as cims-hon). Schema: migrations/0001_jobs.sql.
# Read cache (job packs, versions, summary) — see src/worker.js kvOr()
[[kv_namespaces]]
binding = "CACHE"
id = "d2c49414fba2436c899b5b59f84ca7bc"

[[d1_databases]]
binding = "DB"
database_name = "cims-print"
database_id = "a6c4bf30-c41f-4120-ac28-e22119e8001b"

# Night watch (src/watch.js): 06:15 UTC daily. Emails ONLY when something is
# wrong — once, then at most weekly while it persists. Never a status email.
# Upload reminder (src/remind.js): 13:00 UTC on the 1st (09:00 Miami).
[triggers]
crons = ["15 6 * * *", "0 13 1 * *"]

# Estate mail transport — the only holder of the Resend key.
[[services]]
binding = "MAILER"
service = "cims-mailer"

[vars]
WATCH_ALERT_TO = "Miguel.Sanmartin@dg3.com"
REMIND_TO = "Ohji.Miranda@dg3.com"
# Off until Miguel signs off the rendered reminder. "1" to send.
REMIND_ENABLED = "0"
