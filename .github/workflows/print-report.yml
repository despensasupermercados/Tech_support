# cims-print (print-report/) — tests gate every PR and every push; deploy runs
# only on main, and skips itself until the CLOUDFLARE_API_TOKEN secret exists.
name: print-report

on:
  push:
    branches: [main]
    paths: ["print-report/**", ".github/workflows/print-report.yml"]
  pull_request:
    paths: ["print-report/**", ".github/workflows/print-report.yml"]
  workflow_dispatch: {}

concurrency:
  group: print-report-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: print-report

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Gate on deploy token
        id: gate
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set yet — skipping deploy; tests still gate."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        if: steps.gate.outputs.enabled == 'true'
      - name: Deploy with Wrangler
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: print-report
          wranglerVersion: "3.90.0"
